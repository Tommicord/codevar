# Taplo configuration: TOML formatting for the workspace manifests.
#
# Install with `cargo install taplo-cli`, then run `taplo fmt` to rewrite the
# files matched below or `taplo fmt --check` to verify without writing.
#
# Taplo ignores a key it does not recognize rather than failing, so a typo is
# silently inert: the names below are taken from the formatter's option list.
# The table is `formatting`, not `formatter`.
include = [
    "Cargo.toml",
    "clippy.toml",
    "rust-toolchain.toml",
    "deny.toml",
    "crates/*/Cargo.toml",
]

# .cargo/config.toml is left out: its rustflags arrays pair `-C` with its
# value on consecutive lines, and taplo rewrites every pair onto separate
# lines, which breaks up the pairing that makes the flag list readable.

# Cargo.lock is generated by cargo and its layout is cargo's business.
exclude = ["Cargo.lock", "target/**", ".lane/**"]

[formatting]
# No column alignment. The 74 manifests in this workspace are written without
# it, and turning it on reformats every key in every file: a probe run on
# crates/wredit/Cargo.toml alone rewrote 16 of its 41 lines. Keep the formatter
# to the choices the tree already makes so `taplo fmt --check` is green today
# and only catches real drift later.
align_entries = false
align_comments = false
align_single_comments = false
# Match the 4-space indent of .rustfmt.toml.
indent_string = "    "
indent_tables = false
indent_entries = false
# Wrap at the rustfmt max_width (110) so manifests and code break together.
column_width = 110
# Hand-written key order and grouping stay: re-sorting `[package]` fields or
# dependency lists produces review noise without changing meaning.
reorder_keys = false
reorder_arrays = false
reorder_inline_tables = false
compact_entries = false
compact_arrays = true
# Never re-wrap an array. Several manifests keep a long `features = [...]` on
# one line past the column limit, and expanding them would turn this change
# into a formatting sweep across crates it does not otherwise touch.
array_auto_expand = false
array_auto_collapse = false
array_trailing_comma = true
trailing_newline = true
crlf = false
allowed_blank_lines = 1
