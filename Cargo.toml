[workspace]
members = ["crates/codevar-baseutil",
    "crates/codevar-fastlike-encode", "crates/codevar-fcware",
    "crates/codevar-tlsws", "crates/codevar-wredit"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["Codevar"]
license = "Apache-2.0"
repository = "https://github.com/Tommicord/codevar"

[workspace.dependencies]
cc = "1.2"
bindgen = "0.72.1"
cargo-ndk = "4.1.2"
sha1 = "0.10"
sha2 = "0.10"
webpki-roots = "1"
arc-swap = "1.7"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
ecdsa = { version = "0.16", features = ["der"] }
elliptic-curve = { version = "0.13", features = ["pkcs8", "sec1"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
sec1 = { version = "0.7", features = ["pem", "der"] }
x509-parser = "0.17"
getrandom = "0.2"
rand_core = "0.6"
bsize = "0.3"
count-digits = "0.5.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
gettid = "0.1.4"
pem = "3"

[profile.dev]
opt-level = 0
lto = false
debug = true
panic = "abort"
strip = "none"

[profile.dev.package.dev]
opt-level = 2

[profile.dev.package.release]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 8
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
