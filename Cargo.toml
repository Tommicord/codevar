resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["Tommicord"]
license = "Apache-2.0"
repository = "https://github.com/Tommicord/codevar"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
cc = "1.2"
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
ash = { version = "0.38", default-features = false }
libc = { version = "0.2", default-features = false }
cfg-if = "1.0.5"
cargo-ndk = "4.1.2"
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
webpki-roots = { version = "1", default-features = false }
arc-swap = { version = "1.7", default-features = false }
heapless = { version = "0.9.3", default-features = false }
windows-link = "0.100.0"
wgpu-hal = { version = "30.0.1", default-features = false }
wgpu-types = { version = "30.0.1", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = "0.3"
spin = { version = "0.12.3", default-features = false, features = ["once", "mutex", "rwlock", "barrier", "lazy", "spin_mutex"] }
hkdf = { version = "0.12", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
hmac = { version = "0.12", default-features = false }
bytes = { version = "1.12.1", default-features = false }
const_format = { version = "0.2.36", features = ["fmt"], default-features = false }
rustc-demangle = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"], default-features = false }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"], default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"], default-features = false }
rsa = { version = "0.9", features = ["sha2", "pem"], default-features = false }
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"], default-features = false }
ecdsa = { version = "0.16", features = ["der"], default-features = false }
elliptic-curve = { version = "0.13", features = ["pkcs8", "sec1"], default-features = false }
pkcs8 = { version = "0.10", features = ["pem"], default-features = false }
sec1 = { version = "0.7", features = ["pem", "der"], default-features = false }
defmt = { version = "0.3" }
x509-parser = { version = "0.17", default-features = false, features = ["verify"] }
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
minimal-lexical = { version = "0.2.1", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
time = { version = "0.3", default-features = false, features = ["alloc"] }
displaydoc = { version = "0.2", default-features = false }
data-encoding = { version = "2.11", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.4", default-features = false, features = ["alloc"] }
num-integer = { version = "0.1", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false, features = ["alloc"] }
