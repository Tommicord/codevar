    "crates/wsocket",
    "crates/launcher",
    "crates/wayland",
    "crates/xdg-portal",
    "crates/gpu-core",
    "crates/gpu-vk",
    "crates/gpu-wg",
    "crates/kuitui",
    "crates/kuitui-button",
    "crates/kuitui-text",
    "crates/kuitui-widget",
    "crates/kuitui-rea",
    "crates/logger",
