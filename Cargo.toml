count-digits = "0.5.1"
subtle = { version = "2.6", default-features = false }
unicode-ident = { version = "1.0.24", default-features = false }
deranged = { version = "0.5.2", default-features = false }
num-conv = { version = "0.2.2", default-features = false }
libm = "0.2"
powerfmt = { version = "0.2.0", default-features = false }
zeroize = { version = "1.8", features = ["derive"], default-features = false }
gettid = "0.1.4"
pem = { version = "3", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

