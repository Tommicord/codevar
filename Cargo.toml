[profile.dev]
opt-level = 0
lto = false
debug = true
codegen-units = 8
panic = "abort"
strip = "none"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug-assertions = false

[profile.bench]
inherits = "release"
# Benchmarks measure speed, not binary size: the release profile's
# `opt-level = "z"` would otherwise distort every result.
opt-level = 3
# Thin LTO keeps cross-crate inlining without the very long fat-LTO
# link of the (large) criterion dependency tree.
lto = "thin"
debug = true

[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
