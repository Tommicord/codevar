[package]
name = "codevar-kuitui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kuitui: the retained-mode UI framework of Codevar"

[features]
default = []
# Runs the 8x8 geometry rasterizer on an OpenCL device, falling back to the
# host when no device is available. Off by default because `codevar-ocl` is a
# native dependency and Kuitui also targets WebAssembly.
opencl = ["dep:codevar-ocl", "dep:codevar-oclc", "dep:spin"]

[lib]
name = "codevar_kuitui"

[dependencies]
libm = { workspace = true }
codevar-base = { workspace = true }
codevar-logger = { workspace = true }
codevar-kuitui-control = { workspace = true }
codevar-ocl = { workspace = true, optional = true }
codevar-oclc = { workspace = true, optional = true }
spin = { workspace = true, optional = true }

[lints]
workspace = true
