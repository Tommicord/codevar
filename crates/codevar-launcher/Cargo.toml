[package]
name = "codevar-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ash = { workspace = true }
spin = { workspace = true }
libc = { workspace = true }
codevar-tlsf-alloc = { workspace = true }
codevar-cli-parse = { workspace = true }
codevar-time-core = { workspace = true }
codevar-base = { workspace = true }
codevar-gpu-core = { workspace = true }
codevar-wayland = { workspace = true }
codevar-sig-module-base = { workspace = true }
codevar-sig-handler = { workspace = true }
codevar-env = { workspace = true }
codevar-logger = { workspace = true }
codevar-target = { workspace = true }
codevar-rt = { workspace = true }

# Only for the linker-script helpers in `codevar-rt`; resolver 2 keeps the
# feature out of the binary's own dependency graph.
[build-dependencies]
codevar-rt = { workspace = true, features = ["std"] }

[[bin]]
name = "codevar"
path = "src/bin/main.rs"

[lints]
workspace = true
