[package]
name = "codevar-oclc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[lib]
name = "codevar_oclc"

[dependencies]
bsize = { workspace = true }
spin = { workspace = true }
codevar-cli-arg-parse = { workspace = true }
codevar-ocl-lex = { workspace = true }
codevar-ocl-parse = { workspace = true }
codevar-ocl-sar = { workspace = true }
codevar-ocl-ir = { workspace = true }
codevar-ocl-asm = { workspace = true }
codevar-logger = { workspace = true }
codevar-pathbuf = { workspace = true }
codevar-io = { workspace = true }
codevar-console-util = { workspace = true }
codevar-sig-handler = { workspace = true }
codevar-sig-module-base = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The build script drives the compiler stage crates directly: Cargo forbids a
# package's build script from depending on the package itself, and the driver
# is a thin shell over exactly these stages (`--emit spirv`).
[build-dependencies]
codevar-logger = { workspace = true }
codevar-ocl-sar = { workspace = true }
codevar-ocl-parse = { workspace = true }
codevar-ocl-ir = { workspace = true }
codevar-ocl-asm = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }

[[bin]]
name = "codevar-oclc"
path = "src/bin/main.rs"
