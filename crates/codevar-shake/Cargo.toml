[package]
name = "codevar-shake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "codevar_shake"

[dependencies]
cfg-if = { workspace = true }

# `codevar-base` supplies the pinned CPU feature probe (`basic_cpuid`), but its
# transitive dependency `codevar-time-core` does not build for
# `wasm32-unknown-unknown`. On `wasm32` this crate therefore answers backend
# dispatch from `cfg(target_feature)` only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
codevar-base = { workspace = true }

[lints]
workspace = true
