[package]
name = "codevar-textlike-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
simd-accel = []

[lib]
name = "codevar_textlike_encode"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug"] }

[dependencies]
cfg-if = { workspace = true }

[lints]
workspace = true
