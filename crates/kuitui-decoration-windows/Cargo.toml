[package]
name = "codevar-kuitui-decoration-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Win32 backend for codevar-kuitui-decoration: window styles, extended styles, DWM attributes, icons and cursors"

[lib]
name = "codevar_kuitui_decoration_windows"

[dependencies]
codevar-base = { workspace = true }
codevar-kuitui = { workspace = true }
codevar-kuitui-decoration = { workspace = true }
codevar-kuitui-control = { workspace = true }
codevar-logger = { workspace = true }
spin = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
