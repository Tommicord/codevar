[package]
name = "codevar-kuitui-widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Basic rendering widgets (canvas, text) for the Kuitui UI framework"

[lib]
name = "codevar_kuitui_widget"

[dependencies]
codevar-kuitui = { workspace = true }
codevar-kuitui-text = { workspace = true }
codevar-truetype-core = { workspace = true }
codevar-truetype-emoji-color = { workspace = true }
codevar-truetype-glyf = { workspace = true }
codevar-truetype-sfnt = { workspace = true }
codevar-truetype-smooth = { workspace = true }
codevar-env = { workspace = true }
codevar-pathbuf = { workspace = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Globalization"] }
