version: '3.8'

services:
  # Linux build service
  linux-build:
    build:
      context: ..
      dockerfile: linux/Dockerfile
    image: codevar:linux-latest
    container_name: codevar-linux-build
    volumes:
      - ../target:/app/target
    command: bash -c "cargo build --workspace --release"

  # macOS build service (cross-compilation)
  macos-build:
    build:
      context: ..
      dockerfile: macos/Dockerfile
    image: codevar:macos-latest
    container_name: codevar-macos-build
    volumes:
      - ../target:/app/target
    command: bash -c "cargo build --workspace --release --target x86_64-apple-darwin"

  # Windows build service (cross-compilation)
  windows-build:
    build:
      context: ..
      dockerfile: windows/Dockerfile
    image: codevar:windows-latest
    container_name: codevar-windows-build
    volumes:
      - ../target:/app/target
    command: bash -c "cargo build --workspace --release --target x86_64-pc-windows-gnu"

  # WASM build service
  wasm-build:
    build:
      context: ..
      dockerfile: wasm/Dockerfile
    image: codevar:wasm-latest
    container_name: codevar-wasm-build
    volumes:
      - ../pkg:/app/pkg
    command: bash -c "cd codevar-core && wasm-pack build --release --out-dir ../../pkg/codevar-core"

  # Development environment
  dev:
    build:
      context: ..
      dockerfile: linux/Dockerfile
    image: codevar:dev-latest
    container_name: codevar-dev
    volumes:
      - ..:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true

volumes:
  cargo-cache:
  target-cache: